name: Markdown

on:
  push:
    paths:
      - '**/*.md'
      - '.markdownlint-cli2.jsonc'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/markdown.yml'
  pull_request:
    paths:
      - '**/*.md'
      - '.markdownlint-cli2.jsonc'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/markdown.yml'

permissions:
  contents: read

jobs:
  markdown:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint:md
