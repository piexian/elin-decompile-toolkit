name: Markdown

on:
  push:
    paths:
      - '**/*.md'
      - '.ci/markdown/**'
      - '.github/workflows/markdown.yml'
  pull_request:
    paths:
      - '**/*.md'
      - '.ci/markdown/**'
      - '.github/workflows/markdown.yml'

permissions:
  contents: read

jobs:
  markdown:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: .ci/markdown/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: .ci/markdown
      - run: npm run lint:md
        working-directory: .ci/markdown
